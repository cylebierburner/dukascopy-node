name: build
on:
  pull_request:
  - push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 22
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v2.1.0
        with:
          version: 10.16.1
          run_install: true
      - run: "echo skipped-for-baseline-isolation"
      - run: "echo skipped-for-baseline-isolation"
      - run: pnpm exec vitest run src/cli/tests/cli.test.ts src/utils/date.test.ts src/utils/range.test.ts
      - run: "echo skipped-for-baseline-isolation"
